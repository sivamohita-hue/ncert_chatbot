<!DOCTYPE html>
<html>
<head>
<title>NCERT Chatbot</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(135deg,#ff7eb3,#65d6ce,#6a89ff);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat-container{
    width:450px;
    background:white;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    overflow:hidden;
}

.header{
    background:#2575fc;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
}

.chat-box{
    height:400px;
    overflow-y:auto;
    padding:15px;
}

.message{
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    max-width:80%;
}

.user{
    background:#6a11cb;
    color:white;
    margin-left:auto;
}

.bot{
    background:#f1f1f1;
}

.input-area{
    display:flex;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
    font-size:16px;
}

button{
    background:#2575fc;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
}

button:hover{
    background:#1a5ad9;
}

</style>
</head>

<body>

<div class="chat-container">

<div class="header">
NCERT AI Chatbot
</div>

<div class="chat-box" id="chatBox">

<div class="message bot">
👋 Welcome to the NCERT AI Chatbot!
</div>

<div class="message bot">
You can ask questions in Tanglish or Hinglish.<br>
</div>

</div>

<div class="input-area">
<input type="text" id="question" placeholder="Ask in Tanglish or Hinglish...">
<button onclick="askQuestion()">Send</button>
</div>

</div>

<script>

const input = document.getElementById("question");

input.addEventListener("keypress",function(e){
if(e.key==="Enter"){
askQuestion();
}
});

async function askQuestion(){

let question = input.value;

if(question==="") return;

let chatBox = document.getElementById("chatBox");

chatBox.innerHTML += `<div class="message user">${question}</div>`;

input.value="";

chatBox.innerHTML += `<div class="message bot" id="loading">Thinking...</div>`;

let response = await fetch("http://127.0.0.1:8000/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:question
})

});

let data = await response.json();

document.getElementById("loading").remove();

chatBox.innerHTML += `<div class="message bot">${data.answer}</div>`;

chatBox.scrollTop = chatBox.scrollHeight;

}

</script>

</body>
</html>
